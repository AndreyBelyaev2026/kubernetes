apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.name }}-secret
type: Opaque
data:
  AMQP_EXCHANGE: {{ .Values.api.amqp_exchange | b64enc }}
  AMQP_USER: {{ .Values.api.amqp_user | b64enc }}
  AMQP_PASSWORD: {{ .Values.api.amqp_password | b64enc }}
  AMQP_HOSTNAME: {{ .Values.rabbitmq.name }}-clusterip
  AMQP_QUEUE: {{ .Values.api.amqp_queue | b64enc }}