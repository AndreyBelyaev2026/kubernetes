apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      link_converter: converter
  template:
    metadata:
      name: converter
      labels:
        link_converter: converter
    spec:
      containers:
      - name: converter
        image: antonlarichev/conv-service:1.0
        resources:
          limits:
            memory: "400Mi"
            cpu: "2000m"
        env:
          - name: AMQP_EXCHANGE 
            valueFrom:
                    secretKeyRef:
                      name: conv-api-secret
                      key: AMQP_EXCHANGE
          - name: AMQP_USER 
            valueFrom:
                    secretKeyRef:
                      name: conv-api-secret
                      key: AMQP_USER
          - name: AMQP_PASSWORD
            valueFrom:
                    secretKeyRef:
                      name: conv-api-secret
                      key: AMQP_PASSWORD
          - name: AMQP_HOSTNAME 
            valueFrom:
                    secretKeyRef:
                      name: conv-api-secret
                      key: AMQP_HOSTNAME
          - name: AMQP_QUEUE 
            valueFrom:
                    secretKeyRef:
                      name: conv-api-secret
                      key: AMQP_QUEUE