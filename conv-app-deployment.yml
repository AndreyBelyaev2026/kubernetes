apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      link_converter: frontend
  template:
    metadata:
      name: conv-app
      labels:
        link_converter: frontend
    spec:
      containers:
      - name: conv-app
        image: antonlarichev/conv-app:1.2
        resources:
          limits:
            memory: "300Mi"
            cpu: "500m"
        ports:
          - containerPort: 80
