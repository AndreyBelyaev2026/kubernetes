apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      link_converter: frontend
  template:
    metadata:
      name: conv-app
      labels:
        link_converter: frontend
    spec:
      containers:
      - name: conv-app
        image: antonlarichev/conv-app:1.2
        resources:
          limits:
            memory: "300Mi"
            cpu: "500m"
        ports:
          - containerPort: 80

        # --- LIVENESS PROBE ---
        # Проверяет, не "зависло" ли приложение.
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15   # Ждем 15 сек перед первой проверкой (время на запуск)
          periodSeconds: 10         # Проверяем каждые 10 секунд
          timeoutSeconds: 5         # Если нет ответа за 5 сек, считаем провалом
          failureThreshold: 3       # 3 провала подряд = перезагрузка контейнера
          successThreshold: 1       # 1 успех считается достаточным (по умолчанию)
        volumeMounts:
          - name: api-config
            mountPath: /etc/
            readOnly: true
      volumes:
        - name: api-config
          configMap:
            name: conv-app-config